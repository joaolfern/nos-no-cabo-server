name: Workers

on:
  pull_request:
    paths: ['packages/**', 'services/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']
  push:
    branches: [main]
    paths: ['packages/**', 'services/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']
    tags: ['contract-v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Order matters: Workers that bind to CatalogRpc or to another Worker deploy after it.
      - run: pnpm --filter @nosnocabo/catalog run deploy:staging
      - run: pnpm --filter @nosnocabo/verification run deploy:staging
      - run: pnpm --filter @nosnocabo/router run deploy:staging
      - run: pnpm --filter @nosnocabo/gateway run deploy:staging

  publish-contract:
    if: startsWith(github.ref, 'refs/tags/contract-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      # Trusted Publishing goes through the npm CLI: npm accepts this workflow's OIDC identity.
      # The contract has no workspace dependencies, so npm can publish it as it is.
      - run: npm publish
        working-directory: packages/contract
